<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="40" height="40" fill="none">
  <!-- The landing-page brand dial (.lp-brand__mark): three faders, glowing knobs at their resting positions. -->
  <defs>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
  </defs>
  <g stroke="#9096AE" stroke-width="2" stroke-linecap="round">
    <line x1="8.5" y1="6.5" x2="8.5" y2="25.5"/>
    <line x1="16" y1="6.5" x2="16" y2="25.5"/>
    <line x1="23.5" y1="6.5" x2="23.5" y2="25.5"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="8.5" cy="12.8" r="3.4" fill="#FF6B4A"/>
    <circle cx="16" cy="20.1" r="3.4" fill="#4EC5F1"/>
    <circle cx="23.5" cy="10.5" r="3.4" fill="#FFE566"/>
  </g>
  <circle cx="8.5" cy="12.8" r="3.4" fill="#FF6B4A"/>
  <circle cx="16" cy="20.1" r="3.4" fill="#4EC5F1"/>
  <circle cx="23.5" cy="10.5" r="3.4" fill="#FFE566"/>
</svg>
