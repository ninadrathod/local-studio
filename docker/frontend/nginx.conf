# The Local Studio — nginx site for the frontend container.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API accepts uploads up to 100 MiB (full-frame DSLR files)
    client_max_body_size 101m;

    # Browsers revalidate on every load (cheap 304s), so updated JS / CSS never mixes
    # with stale cached copies after a rebuild.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker's embedded DNS, re-resolved so a restarted backend (new IP) is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Errors nginx produces itself are sent as JSON {"detail": …}, the same shape as
    # the API's own errors, so the studio can show a clear message instead of a
    # generic failure. (Errors the backend returns, e.g. 503 busy, pass through as-is.)
    server_tokens off;
    error_page 413 /__err/413;
    error_page 502 /__err/502;
    error_page 504 /__err/504;
    location = /__err/413 {
        internal;
        default_type application/json;
        return 413 '{"detail":"That file is larger than the 100 MB upload limit."}';
    }
    location = /__err/502 {
        internal;
        default_type application/json;
        return 502 '{"detail":"The image service is not running or is restarting. Try again in a moment (docker compose ps shows its status)."}';
    }
    location = /__err/504 {
        internal;
        default_type application/json;
        return 504 '{"detail":"The edit took too long and timed out. Try a smaller image."}';
    }

    # Only the API routes and the health check reach the backend — not its
    # interactive docs (/docs, /redoc, /openapi.json).
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI upscales / subject cut-outs on large photos can take a few minutes
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /health {
        proxy_pass $backend;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
