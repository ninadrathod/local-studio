<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Local Studio</title>
    <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ["Fredoka", "system-ui", "sans-serif"],
              brand: ["Lilita One", "Fredoka", "system-ui", "sans-serif"],
              sans: ["Nunito", "system-ui", "sans-serif"],
            },
            colors: {
              ink: "#1a1a1a",
              mute: "#5c5652",
              paper: "#fff8e7",
              chalk: "#fffef8",
              line: "#1a1a1a",
              coral: {
                DEFAULT: "#ff6b4a",
                deep: "#e85535",
              },
              sky: "#4ec5f1",
              lemon: "#ffe566",
              rose: "#e85535",
            },
            maxWidth: {
              stage: "84rem",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="font-sans text-ink bg-paper antialiased studio-page">
    <div class="page-shell studio-shell flex flex-col">
      <header class="site-header shrink-0">
        <div
          class="studio-header-inner mx-auto w-full px-4 sm:px-6 lg:px-8 grid grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-2 sm:gap-3"
        >
          <div aria-hidden="true"></div>
          <a
            href="index.html"
            class="flex items-center justify-center gap-2 sm:gap-2.5 min-w-0 max-w-full"
          >
            <img src="icons/logo.svg" alt="" class="studio-header-logo shrink-0" />
            <span class="site-brand font-brand tracking-wide truncate">
              The Local Studio
            </span>
          </a>
          <nav class="justify-self-end flex items-center shrink-0">
            <a
              href="docs/"
              class="px-2 sm:px-3 py-1.5 text-sm font-bold text-ink/70 hover:text-ink transition-colors"
            >
              About
            </a>
          </nav>
        </div>
      </header>

      <main class="studio-main flex-1 min-h-0 mx-auto w-full px-3 sm:px-5 lg:px-6">
        <section aria-label="Studio workspace" class="workspace studio-layout h-full min-h-0">
          <div class="studio-columns h-full min-h-0">
            <!-- Left: intro + search + preset gallery -->
            <aside class="studio-columns__left flex flex-col gap-2 min-w-0 min-h-0 order-1">
              <div class="studio-section-head shrink-0">
                <h2 class="font-display font-semibold text-ink shrink-0">
                  Presets
                </h2>
                <p class="preset-touch-hint" aria-hidden="true">Hold to compare</p>
              </div>
              <div class="preset-filter-row shrink-0">
                <fieldset class="square-filter shrink-0" id="square-filter">
                  <legend class="sr-only">Is the input image square?</legend>
                  <span class="square-filter__label" aria-hidden="true">Input square?</span>
                  <div class="preset-filter-row__controls">
                    <div class="square-filter__switch" role="radiogroup" aria-label="Is the input image square?">
                      <label class="square-filter__opt">
                        <input
                          type="radio"
                          name="input-square"
                          id="input-square-yes"
                          value="yes"
                          checked
                        />
                        <span>Yes</span>
                      </label>
                      <label class="square-filter__opt">
                        <input
                          type="radio"
                          name="input-square"
                          id="input-square-no"
                          value="no"
                        />
                        <span>No</span>
                      </label>
                    </div>
                    <button
                      type="button"
                      id="popular-sort-btn"
                      class="popular-sort-btn"
                      aria-pressed="false"
                      aria-label="Sort presets by popularity"
                    >
                      <span>Popular</span>
                    </button>
                  </div>
                </fieldset>
              </div>

              <label class="sr-only" for="preset-search">Search presets by name or keyword</label>
              <div class="preset-search-row preset-cols shrink-0">
                <input
                  id="preset-search"
                  type="search"
                  autocomplete="off"
                  spellcheck="false"
                  maxlength="64"
                  placeholder="Search by name or keyword…"
                  class="preset-search-input"
                />
                <button
                  type="button"
                  id="preset-reset"
                  class="preset-reset-btn"
                  aria-label="Clear selected preset"
                  title="Clear selected preset"
                  disabled
                >
                  <img src="icons/reset.svg" alt="" class="preset-reset-btn__icon" />
                </button>
              </div>
              <p id="search-error" class="hidden text-sm text-rose font-bold px-0.5 shrink-0" role="alert"></p>

              <div
                id="preset-grid"
                class="preset-grid preset-cols min-h-0"
                role="listbox"
                aria-label="Available presets"
              >
                <p id="preset-loading" class="col-span-full text-sm text-mute font-semibold py-6 text-center">
                  Loading presets…
                </p>
              </div>
              <p id="preset-error" class="hidden text-sm text-rose font-bold px-0.5 shrink-0" role="alert"></p>
            </aside>

            <!-- Right: upload + generate -->
            <div class="studio-columns__right flex flex-col gap-2 sm:gap-2.5 min-w-0 min-h-0 order-2">
              <!-- Upload -->
              <div class="studio-panel flex flex-col gap-1.5 min-h-0">
                <div class="studio-section-head shrink-0">
                  <h2 class="font-display font-semibold text-ink shrink-0">
                    Your image
                  </h2>
                  <p id="file-meta" class="section-meta text-xs text-mute font-semibold truncate hidden"></p>
                </div>

                <div id="preset-text-wrap" class="preset-text-wrap hidden" hidden>
                  <label for="preset-text" class="preset-text-label">Text for this preset</label>
                  <div class="preset-text-row">
                    <input
                      id="preset-text"
                      type="text"
                      autocomplete="off"
                      spellcheck="true"
                      class="preset-text-input"
                      aria-hidden="true"
                    />
                    <span id="preset-text-count" class="preset-text-count" aria-live="polite"></span>
                  </div>
                </div>

                <label
                  id="drop-zone"
                  for="image-input"
                  class="drop-zone drop-zone--locked stage stage--upload group relative flex flex-col items-center justify-center cursor-pointer outline-none focus-visible:shadow-[3px_3px_0_#ff6b4a] min-h-0"
                  aria-disabled="true"
                >
                  <input
                    id="image-input"
                    type="file"
                    accept="image/*"
                    class="sr-only"
                    disabled
                  />
                  <img
                    id="preview-original"
                    alt="Uploaded preview"
                    class="preview-img hidden"
                  />
                  <div
                    id="upload-prompt"
                    class="flex flex-col items-center gap-2 px-3 sm:px-5 text-center pointer-events-none"
                  >
                    <span class="upload-icon-wrap" aria-hidden="true">
                      <img src="icons/upload.svg" alt="" class="w-6 h-6 sm:w-7 sm:h-7" />
                    </span>
                    <div>
                      <p id="upload-prompt-title" class="font-bold text-ink text-xs sm:text-sm">
                        Select a preset first
                      </p>
                      <p id="upload-prompt-sub" class="mt-0.5 text-[0.65rem] sm:text-xs text-mute font-semibold">
                        Then drop an image, or browse
                      </p>
                    </div>
                  </div>
                </label>
                <p id="file-error" class="hidden text-sm text-rose font-bold px-0.5 shrink-0" role="alert"></p>
              </div>

              <!-- Actions between upload and result -->
              <div
                class="actions actions-bar flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-end shrink-0"
              >
                <p
                  id="api-error"
                  class="hidden text-sm text-rose font-bold text-center sm:text-left sm:mr-auto break-words"
                  role="alert"
                ></p>
                <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                  <a
                    id="download-btn"
                    href="#"
                    download="edited-image.png"
                    class="btn btn-ghost hidden w-full sm:w-auto text-center"
                  >
                    Download
                  </a>
                  <button
                    id="generate-btn"
                    type="button"
                    disabled
                    class="btn btn-primary font-display w-full sm:w-auto sm:min-w-[10rem]"
                  >
                    Generate edit
                  </button>
                </div>
              </div>

              <!-- Result -->
              <div class="studio-panel flex flex-col gap-1.5 min-h-0">
                <div class="studio-section-head shrink-0">
                  <h2 class="font-display font-semibold text-ink shrink-0">
                    Edited result
                  </h2>
                  <span id="selected-preset-label" class="section-meta text-xs text-mute font-semibold tracking-wide truncate">
                    No preset selected
                  </span>
                </div>

                <div class="stage stage--result relative overflow-hidden min-h-0">
                  <p
                    id="result-placeholder"
                    class="absolute inset-0 flex items-center justify-center text-mute text-xs sm:text-sm font-semibold px-4 text-center"
                  >
                    Your edited image will appear here
                  </p>
                  <img
                    id="preview-edited"
                    alt="Edited result"
                    class="preview-img hidden"
                  />
                  <div
                    id="loading"
                    class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center gap-2 bg-chalk/90"
                  >
                    <div class="spinner" aria-hidden="true"></div>
                    <span class="text-xs sm:text-sm font-bold text-ink">Generating edit…</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer studio-footer shrink-0">
        <div
          class="mx-auto w-full px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-1 text-mute font-semibold"
        >
          <span>The Local Studio</span>
          <a href="docs/" class="hover:text-ink transition-colors font-bold">Project overview</a>
        </div>
      </footer>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
